name: Render social SVG to PNG
on:
  push:
    paths:
      - 'pruebas/*.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Convert SVG artwork to PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for src in Path("pruebas").glob("*.svg"):
              cairosvg.svg2png(url=str(src),write_to=str(src.with_suffix(".png")))
          PY
      - name: Commit PNG images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pruebas/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Render social artwork PNG"
            git push
          fi
